name: connectivity-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tencent quote endpoint
        run: |
          set -o pipefail
          curl -sS -m 20 'https://qt.gtimg.cn/q=sh600519' -o /tmp/quote.txt
          echo "bytes=$(wc -c < /tmp/quote.txt)"
          head -c 160 /tmp/quote.txt | iconv -f GBK -t UTF-8 2>/dev/null || head -c 160 /tmp/quote.txt
          echo
      - name: Tencent kline endpoint
        run: |
          set -o pipefail
          curl -sS -m 20 'https://web.ifzq.gtimg.cn/appstock/app/kline/kline?param=sh600519,day,,,5' -o /tmp/kline.json
          echo "bytes=$(wc -c < /tmp/kline.json)"
          head -c 200 /tmp/kline.json
          echo
      - name: Sina quote endpoint
        run: |
          set -o pipefail
          curl -sS -m 20 'https://hq.sinajs.cn/list=sh600519' -H 'Referer: https://finance.sina.com.cn/' -o /tmp/sina.txt
          echo "bytes=$(wc -c < /tmp/sina.txt)"
          head -c 160 /tmp/sina.txt | iconv -f GBK -t UTF-8 2>/dev/null || head -c 160 /tmp/sina.txt
          echo
