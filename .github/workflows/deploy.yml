name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 5 minutes during the A-share session (China 09:00-15:59).
    - cron: "*/5 1-7 * * 1-5"
    # Hourly full refresh (China 09:05-14:05) plus the post-close snapshot.
    - cron: "5 1-6 * * 1-5"
    - cron: "10 7 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: static-dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FULL_REFRESH: ${{ github.event_name != 'schedule' || github.event.schedule == '5 1-6 * * 1-5' || github.event.schedule == '10 7 * * 1-5' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install runtime dependencies
        run: pip install -r requirements-ci.txt

      - name: Restore previous encrypted snapshot
        uses: actions/cache/restore@v4
        with:
          path: previous/static-api
          key: static-api-full-${{ hashFiles('build/crypto-meta.json') }}-${{ github.run_id }}
          restore-keys: |
            static-api-full-${{ hashFiles('build/crypto-meta.json') }}-

      - name: Decrypt runtime data bundle
        env:
          SOURCE_DATA_KEY: ${{ secrets.SOURCE_DATA_KEY }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in bundle/source-data.tar.gz.enc \
            -out /tmp/source-data.tar.gz \
            -pass env:SOURCE_DATA_KEY
          tar -xzf /tmp/source-data.tar.gz -C .
          rm -f /tmp/source-data.tar.gz
          test -f config/portfolio.json
          test -f data/dashboard-quote-cache.json

      - name: Align quote-cache mtimes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cache_path = Path("data/dashboard-quote-cache.json")
          if not cache_path.is_file():
              print("no quote cache; skip")
              raise SystemExit(0)
          cache = json.loads(cache_path.read_text(encoding="utf-8"))
          payload = cache.get("payload") or {}
          portfolio = Path("config/portfolio.json")
          extras = Path("config/portfolios.json")
          if portfolio.is_file():
              ns = portfolio.stat().st_mtime_ns
              cache["portfolio_config_mtime_ns"] = ns
              if isinstance(payload.get("portfolio"), dict):
                  payload["portfolio"]["config_mtime_ns"] = ns
          if extras.is_file():
              payload["extras_config_mtime_ns"] = extras.stat().st_mtime_ns
          cache["payload"] = payload
          cache_path.write_text(json.dumps(cache, ensure_ascii=False), encoding="utf-8")
          print("aligned quote cache mtimes", cache.get("portfolio_config_mtime_ns"), payload.get("extras_config_mtime_ns"))
          PY

      - name: Start dashboard server
        run: |
          set -euo pipefail
          nohup python scripts/dashboard_server.py \
            --port 8765 --no-news-warmup --no-background-refresh \
            > /tmp/dashboard-server.log 2>&1 &
          echo $! > /tmp/dashboard-server.pid
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8765/api/health > /tmp/health.json; then
              echo "server ready after ${i} tries"
              head -c 600 /tmp/health.json
              echo
              exit 0
            fi
            sleep 2
          done
          echo "server failed to start" >&2
          tail -200 /tmp/dashboard-server.log >&2
          exit 1

      - name: Export read-only API snapshots
        run: |
          set -euo pipefail
          if [ "${FULL_REFRESH}" = "true" ]; then
            python build/export_static.py --out export
          else
            python build/export_static.py --out export --fast
          fi
          ls -lh export/static-api | tail -5

      - name: Build encrypted static site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${FULL_REFRESH}" = "true" ]; then
            python build/build_site.py --password "$SITE_PASSWORD" --previous previous --full
          else
            python build/build_site.py --password "$SITE_PASSWORD" --previous previous
          fi

      - name: Save encrypted snapshot for fast runs
        if: env.FULL_REFRESH == 'true'
        run: |
          set -euo pipefail
          mkdir -p previous
          rm -rf previous/static-api
          cp -a site/static-api previous/static-api

      - name: Save previous encrypted snapshot cache
        if: env.FULL_REFRESH == 'true'
        uses: actions/cache/save@v4
        with:
          path: previous/static-api
          key: static-api-full-${{ hashFiles('build/crypto-meta.json') }}-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub disables scheduled workflows after 60 days without repository
      # activity.  A small weekly commit keeps the schedule alive.
      - name: Weekly heartbeat commit
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          if [ "$(date -u +%u)" = "1" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .heartbeat
            git commit -m "chore: weekly heartbeat" || true
            git push || true
          fi

      - name: Server log tail on failure
        if: failure()
        run: tail -200 /tmp/dashboard-server.log || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
